<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('background.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }

        #forgot-form {
            background: rgba(150, 221, 136, 0.2);
            padding: 30px 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            height: 380px;

            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .forgot-container {
            width: 100%;
            /* max-width: 600px; */
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .return1 {
            margin-bottom: 20px;
            font-size: 14px;
        }

        a:link,
        a:visited {
            text-decoration: none;
            color: rgb(60, 60, 252);
        }

        a:hover {
            text-decoration: underline;
            color: rgb(60, 60, 252);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .form-subtitle {
            text-align: center;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .frgt input {
            width: 100%;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            outline: 3px solid #6cd426;
            box-shadow: 0 0 5px rgba(108, 212, 38, 0.8), 0 0 15px rgba(108, 212, 38, 0.6);
        }

        .frgt button {
            width: 100%;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            background-color: #6bd624;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 25px;
        }

        .frgt button:hover {
            transform: translateY(-2px);
            background-color: #66c224;
            box-shadow: 0 0 5px rgba(108, 212, 38, 0.8), 0 0 15px rgba(108, 212, 38, 0.6);
        }

        .return {
            text-align: center;
            font-size: 14px;
        }

        .return a {
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="forgot-container">
        <form id="forgot-form">
            <p class="return1"> <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
            <h2>Reset Password</h2>
            <p class="form-subtitle">Enter your email address or username and we'll send you a link to reset your
                password</p>
            <div class="frgt">
                <input type="text" id="user" name="user" placeholder="Enter your email or username" required>
                <button type="submit">Send Reset Link</button>
            </div>
            <p class="return">Remember your password? <a href="index.html">Back to Login</a></p>
        </form>
    </div>
</body>

</html>
